name: Publish Kit

# Publish both forms of the kit when they change on main, and allow manual runs:
#   kit spec v2  -> docker.io/firecrawl/firecrawl-docker-sandbox   (spec.yaml, sbx kit push)
#   Kit v3       -> docker.io/firecrawl/sbx-kit-firecrawl          (v3/firecrawl.yaml, docker buildx)
# Requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets for an account with push access
# to the firecrawl Docker Hub namespace.
on:
  push:
    branches: [main]
    paths:
      - spec.yaml
      - v3/**
      - README.md
      - LICENSE
      - NOTICE
      - scripts/**
      - .github/workflows/publish.yaml
  workflow_dispatch:
    inputs:
      sbx_release:
        description: "docker/sbx-releases tag to install (must support kit-spec v2)"
        required: true
        default: "v0.45.0"
      tag:
        description: "OCI tag to publish"
        required: false
        default: "latest"

env:
  DOCKERHUB_NAMESPACE: firecrawl
  KIT_NAME: firecrawl-docker-sandbox
  KIT_V3_NAME: sbx-kit-firecrawl

jobs:
  publish-kit-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
          # On a push event `inputs` is empty, so fall back to the v2-capable default.
          SBX_RELEASE: ${{ inputs.sbx_release || 'v0.45.0' }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish kit artifact
        env:
          # push-kit.sh validates (sbx kit validate) before it pushes, so a bad
          # spec fails the job before anything reaches Docker Hub.
          TAG: ${{ inputs.tag || 'latest' }}
        run: bash ./scripts/push-kit.sh

      - name: Sync Docker Hub overview page
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.KIT_NAME }}
          readme-filepath: ./README.md
          short-description: "Docker Sandboxes mixin adding live web search/scrape/crawl via Firecrawl"

  publish-kit-v3:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the v3 kit
        # The kit frontend validates the descriptor during the build, so a bad
        # descriptor fails the job before anything reaches Docker Hub. The
        # version tag is read from v3/firecrawl.yaml; :latest moves with it.
        run: bash ./scripts/push-kit-v3.sh
